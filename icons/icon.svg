<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Physio &amp; Bogen</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14A0A9"/>
      <stop offset="0.55" stop-color="#0E7C86"/>
      <stop offset="1" stop-color="#095157"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3CB4F"/>
      <stop offset="1" stop-color="#D4A72C"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2A04E"/>
      <stop offset="1" stop-color="#E07A1F"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD9A8"/>
      <stop offset="1" stop-color="#F2A04E"/>
    </linearGradient>
  </defs>
  <g id="bgshape">
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>
    <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  </g>
  <g id="art">
    <!-- target -->
    <circle cx="296" cy="226" r="154" fill="#063B40" opacity="0.28" transform="translate(6 10)"/>
    <circle cx="296" cy="226" r="150" fill="#FFFFFF"/>
    <circle cx="296" cy="226" r="122" fill="#E07A1F"/>
    <circle cx="296" cy="226" r="94" fill="#FFFFFF"/>
    <circle cx="296" cy="226" r="66" fill="#0E7C86"/>
    <circle cx="296" cy="226" r="40" fill="url(#gold)"/>
    <circle cx="296" cy="226" r="150" fill="none" stroke="#0A5C63" stroke-opacity="0.18" stroke-width="3"/>
    <!-- arrow with leaf fletching, flying in from lower left -->
    <g transform="translate(296 226) rotate(-45)">
      <rect x="-250" y="-6" width="262" height="12" rx="6" fill="#063B40" opacity="0.25" transform="translate(4 8)"/>
      <rect x="-250" y="-6" width="250" height="12" rx="6" fill="#FFF4E3" stroke="#0A4A50" stroke-width="3"/>
      <circle cx="0" cy="0" r="9" fill="#14181F" opacity="0.35"/>
      <!-- leaves -->
      <path d="M -246 -4 C -236 -48, -190 -62, -160 -52 C -176 -30, -200 -10, -246 -4 Z" fill="url(#leafA)"/>
      <path d="M -246 -4 C -214 -24, -188 -38, -162 -51" fill="none" stroke="#B85E10" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
      <path d="M -246 4 C -236 48, -190 62, -160 52 C -176 30, -200 10, -246 4 Z" fill="url(#leafB)"/>
      <path d="M -246 4 C -214 24, -188 38, -162 51" fill="none" stroke="#E07A1F" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <rect x="-262" y="-7" width="18" height="14" rx="5" fill="#E07A1F"/>
    </g>
  </g>
</svg>
